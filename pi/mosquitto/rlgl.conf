# Mosquitto 2.x บน Raspberry Pi: broker เดียวของระบบ RLGL
# วางที่ /etc/mosquitto/conf.d/rlgl.conf (ใช้สคริปต์ pi/setup_mosquitto.sh ได้)
#
# ไม่ต้องใส่ persistence / log_dest / pid_file ที่นี่ เพราะ /etc/mosquitto/mosquitto.conf
# ของ Pi OS ตั้งไว้แล้ว (ใส่ซ้ำจะ error: Duplicate ...)

# MQTT ปกติ สำหรับ ESP1, ESP2, สคริปต์บน Pi, Telegraf, Game Engine, backend
listener 1883 0.0.0.0
protocol mqtt

# MQTT ผ่าน WebSocket สำหรับหน้าเว็บ (เบราว์เซอร์ต่อ MQTT ตรงๆ ไม่ได้)
listener 9001 0.0.0.0
protocol websockets

# ใช้ในวง LAN ของกลุ่มเท่านั้น ห้ามเปิดออกอินเทอร์เน็ต
# ถ้าจะใช้รหัสผ่าน: ตั้ง password_file แล้วเปลี่ยนเป็น allow_anonymous false
# (ESP และเว็บต้องส่ง user/password ด้วย และ MQTT_USER/MQTT_PASSWORD ใน laptop/infra/.env ต้องตรงกัน)
allow_anonymous true

# บันทึกการต่อ/ตัดของแต่ละ client ไว้ดูตอน debug (ดูด้วย: sudo journalctl -u mosquitto -f)
connection_messages true
