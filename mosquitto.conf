# Mosquitto บน laptop (broker หลัก)
# รัน:  mosquitto -c mosquitto.conf -v
# Windows: "C:\Program Files\mosquitto\mosquitto.exe" -c mosquitto.conf -v
# ต้องเปิด Windows Firewall ให้ port 1883 และ 9001 ถ้าจะให้ Pi / ESP32 ต่อเข้ามา

# MQTT ปกติ สำหรับ Pi, ESP32, Game Engine
listener 1883 0.0.0.0
allow_anonymous true

# WebSocket สำหรับหน้าเว็บเกม (mqtt.js ในเบราว์เซอร์)
listener 9001 0.0.0.0
protocol websockets
