# Telegraf: subscribe MQTT แล้วเขียนลง InfluxDB
# หนึ่ง input ต่อหนึ่ง measurement เพื่อให้ชื่อใน database ตรงตามชนิดข้อมูล
# ใช้เวลาตอนรับข้อความเป็นเวลาของข้อมูล (ts จากอุปกรณ์เก็บเป็น field)

[agent]
  interval = "1s"
  flush_interval = "1s"
  metric_batch_size = 500
  metric_buffer_limit = 50000
  omit_hostname = true

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"

[[inputs.mqtt_consumer]]
  name_override = "imu"
  servers = ["${MQTT_URL}"]
  username = "${MQTT_USER}"
  password = "${MQTT_PASSWORD}"
  topics = ["rlgl/wrist/imu"]
  qos = 0
  data_format = "json"
  tag_keys = ["device_id"]

[[inputs.mqtt_consumer]]
  name_override = "heartrate"
  servers = ["${MQTT_URL}"]
  username = "${MQTT_USER}"
  password = "${MQTT_PASSWORD}"
  topics = ["rlgl/wrist/heartrate"]
  qos = 0
  data_format = "json"
  tag_keys = ["device_id"]
  # เก็บทุกค่า (รวม bpm 0 ตอนวัดไม่ได้ และสัญญาณดิบ raw) กรองช่วง 45-180 ที่กราฟใน Grafana แทน

[[inputs.mqtt_consumer]]
  name_override = "camera"
  servers = ["${MQTT_URL}"]
  username = "${MQTT_USER}"
  password = "${MQTT_PASSWORD}"
  topics = ["rlgl/station/camera"]
  qos = 1
  data_format = "json"
  tag_keys = ["device_id"]
  json_string_fields = ["facing"]

[[inputs.mqtt_consumer]]
  name_override = "button"
  servers = ["${MQTT_URL}"]
  username = "${MQTT_USER}"
  password = "${MQTT_PASSWORD}"
  topics = ["rlgl/station/button"]
  qos = 1
  data_format = "json"
  tag_keys = ["device_id"]

[[inputs.mqtt_consumer]]
  name_override = "finish"
  servers = ["${MQTT_URL}"]
  username = "${MQTT_USER}"
  password = "${MQTT_PASSWORD}"
  topics = ["rlgl/gateway/finish"]
  qos = 1
  data_format = "json"
  tag_keys = ["device_id"]
  json_string_fields = ["round_id"]

[[inputs.mqtt_consumer]]
  name_override = "distance"
  servers = ["${MQTT_URL}"]
  username = "${MQTT_USER}"
  password = "${MQTT_PASSWORD}"
  topics = ["rlgl/gateway/distance"]
  qos = 0
  data_format = "json"
  tag_keys = ["device_id"]

[[inputs.mqtt_consumer]]
  name_override = "vision"
  servers = ["${MQTT_URL}"]
  username = "${MQTT_USER}"
  password = "${MQTT_PASSWORD}"
  topics = ["rlgl/gateway/vision"]
  qos = 0
  data_format = "json"
  tag_keys = ["device_id"]

[[inputs.mqtt_consumer]]
  name_override = "game_state"
  servers = ["${MQTT_URL}"]
  username = "${MQTT_USER}"
  password = "${MQTT_PASSWORD}"
  topics = ["rlgl/game/state"]
  qos = 1
  data_format = "json"
  tag_keys = ["device_id"]
  json_string_fields = ["state", "round_id"]

[[inputs.mqtt_consumer]]
  name_override = "game_result"
  servers = ["${MQTT_URL}"]
  username = "${MQTT_USER}"
  password = "${MQTT_PASSWORD}"
  topics = ["rlgl/game/result"]
  qos = 1
  data_format = "json"
  tag_keys = ["device_id"]
  json_string_fields = ["round_id", "result", "reason"]

[[inputs.mqtt_consumer]]
  name_override = "game_summary"
  servers = ["${MQTT_URL}"]
  username = "${MQTT_USER}"
  password = "${MQTT_PASSWORD}"
  topics = ["rlgl/game/summary"]
  qos = 1
  data_format = "json"
  tag_keys = ["device_id"]
  json_string_fields = ["round_id"]

[[inputs.mqtt_consumer]]
  name_override = "media"
  servers = ["${MQTT_URL}"]
  username = "${MQTT_USER}"
  password = "${MQTT_PASSWORD}"
  topics = ["rlgl/game/media"]
  qos = 1
  data_format = "json"
  tag_keys = ["device_id"]
  json_string_fields = ["round_id", "status", "video_url"]

[[inputs.mqtt_consumer]]
  name_override = "device_status"
  servers = ["${MQTT_URL}"]
  username = "${MQTT_USER}"
  password = "${MQTT_PASSWORD}"
  topics = ["rlgl/status/+"]
  qos = 1
  data_format = "json"
  tag_keys = ["device_id"]
  json_string_fields = ["status"]

# round_id ต้องเป็นข้อความเสมอ: game engine ส่งเป็นตัวเลข แต่ InfluxDB เก็บเป็น string มาก่อน
# ถ้าชนิดไม่ตรง InfluxDB ปฏิเสธการเขียน (422 field type conflict) และช่องรับข้อมูลที่ถี่ เช่น IMU จะค้าง
# ค่าจริง/เท็จต้องเป็นตัวเลข (1/0) เสมอ: อุปกรณ์บางตัวส่ง true/false บางตัวส่ง 1/0
# InfluxDB เก็บ field ชื่อเดียวได้ชนิดเดียว ถ้าสลับกันจะเขียนไม่ผ่านเหมือนเรื่อง round_id
[[processors.converter]]
  [processors.converter.fields]
    string = ["round_id"]
    float = ["valid", "motion", "moved", "player_seen", "touched", "first", "pressed"]
