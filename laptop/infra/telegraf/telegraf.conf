# Telegraf: subscribe MQTT แล้วเขียนลง InfluxDB
# หนึ่ง input ต่อหนึ่ง measurement เพื่อให้ชื่อใน database ตรงตามชนิดข้อมูล
# ใช้เวลาตอนรับข้อความเป็นเวลาของข้อมูล (ts จากอุปกรณ์เก็บเป็น field)

[agent]
  interval = "1s"
  flush_interval = "1s"
  metric_batch_size = 500
  metric_buffer_limit = 50000
  omit_hostname = true

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"

[[inputs.mqtt_consumer]]
  name_override = "imu"
  servers = ["${MQTT_URL}"]
  username = "${MQTT_USER}"
  password = "${MQTT_PASSWORD}"
  topics = ["rlgl/wrist/imu"]
  qos = 0
  data_format = "json"
  tag_keys = ["device_id"]

[[inputs.mqtt_consumer]]
  name_override = "heartrate"
  servers = ["${MQTT_URL}"]
  username = "${MQTT_USER}"
  password = "${MQTT_PASSWORD}"
  topics = ["rlgl/wrist/heartrate"]
  qos = 0
  data_format = "json"
  tag_keys = ["device_id"]
  # กรองซ้ำอีกชั้น: ไม่บันทึกค่านอกช่วง 45-180 BPM
  metricpass = "fields.bpm >= 45.0 && fields.bpm <= 180.0"

[[inputs.mqtt_consumer]]
  name_override = "camera"
  servers = ["${MQTT_URL}"]
  username = "${MQTT_USER}"
  password = "${MQTT_PASSWORD}"
  topics = ["rlgl/station/camera"]
  qos = 1
  data_format = "json"
  tag_keys = ["device_id"]
  json_string_fields = ["facing"]

[[inputs.mqtt_consumer]]
  name_override = "button"
  servers = ["${MQTT_URL}"]
