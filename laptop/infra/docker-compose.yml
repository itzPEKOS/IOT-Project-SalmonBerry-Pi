name: rlgl

services:
  # broker ชั่วคราวสำหรับพัฒนาเท่านั้น (ตอนรวมระบบ broker อยู่บน Pi)
  # ปิดได้โดยลบ COMPOSE_PROFILES=devbroker ออกจาก .env
  mosquitto:
    image: eclipse-mosquitto:2
    profiles: [devbroker]
    environment:
      MQTT_USER: ${MQTT_USER:?set in .env}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set in .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        rm -f /mosquitto/data/passwd &&
        mosquitto_passwd -b -c /mosquitto/data/passwd "$$MQTT_USER" "$$MQTT_PASSWORD" &&
        chown mosquitto:mosquitto /mosquitto/data/passwd &&
        chmod 600 /mosquitto/data/passwd &&
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    ports:
      - "${BIND_IP:-127.0.0.1}:1883:1883"
      - "${BIND_IP:-127.0.0.1}:9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data

  influxdb:
    image: influxdb:2.7
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USER:?set in .env}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:?set in .env}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-rlgl}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-rlgl}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:?set in .env}
      INFLUXD_REPORTING_DISABLED: "true"
    ports:
      - "127.0.0.1:8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      timeout: 5s
      retries: 24

  telegraf:
    image: telegraf:1.35
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      MQTT_URL: ${MQTT_URL:-tcp://mosquitto:1883}
      MQTT_USER: ${MQTT_USER}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      INFLUX_ORG: ${INFLUX_ORG:-rlgl}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-rlgl}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:?set in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set in .env}
      # ค่าสำหรับฝัง panel ในหน้าเว็บเกม: เปิดดูได้โดยไม่ล็อกอิน (สิทธิ์อ่านอย่างเดียว)
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 1s
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/rlgl.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      # ไม่ให้ Grafana ดาวน์โหลด plugin เสริมจากอินเทอร์เน็ตเองตอนเริ่มทำงาน (ต้องใช้ได้ในวง LAN)
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      INFLUX_ORG: ${INFLUX_ORG:-rlgl}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-rlgl}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
    ports:
      - "${BIND_IP:-127.0.0.1}:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

# วงภายในของ Docker ต้องไม่ทับวงที่ Pi อยู่ ไม่งั้น Telegraf หา Pi ไม่เจอ (no route to host)
# ค่าเริ่มต้นของ Docker คือ 172.17-172.31.x.x ซึ่งทับ hotspot iPhone (172.20.10.x)
networks:
  default:
    ipam:
      config:
        - subnet: 192.168.250.0/24

volumes:
  mosquitto-data:
  influxdb-data:
  influxdb-config:
  grafana-data:
